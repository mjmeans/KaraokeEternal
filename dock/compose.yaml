services:
  karaoke:
    build:
      context: https://github.com/mjmeans/KaraokeEternal.git#refs/heads/dock
      args:
        TAG: 2.0.0
      dockerfile: dock/Dockerfile-node24
    environment:
      - KES_PATH_DATA=/config
      - KES_PORT=8080
      - KES_SCANNER_LOG_LEVEL=3
      - KES_SERVER_LOG_LEVEL=3
    ports:
      - "19201:8080"
    volumes:
      - /mnt/Storage/media/karaoke:/mnt/karaoke:ro
      - /mnt/Storage/apps/ke2-0-2-beta-migration-test:/config
    restart: unless-stopped
