services:
  karaokeeternal:
    build:
      # context: https://github.com/mjmeans/KaraokeEternal.git#refs/tags/v2.0.1
      context: https://github.com/mjmeans/KaraokeEternal.git#refs/heads/dock
      dockerfile: ./src/dock/Dockerfile

    ports:
      - "9201:8080"

    volumes:
      # Host media directory → container media directory
      - ./media:/mnt/karaoke:ro

      # Persistent app data (SQLite DB, config)
      - ./data:/config

    environment:
      KE_MEDIA_DIR: /mnt/karaoke
      KE_DATA_DIR: /config
      NODE_ENV: production

    restart: unless-stopped
