services:
  karaoke:
    build:
      context: https://github.com/mjmeans/KaraokeEternal.git#refs/heads/dock
      dockerfile: dock/Dockerfile
    environment:
      - KES_PATH_DATA=/config
      - KES_PORT=8080
    ports:
      - '19201:8080'
    restart: unless-stopped
    volumes:
      - ./mnt/Storage/karaoke:/mnt/karaoke:ro
      - ./mnt/Storage/apps/ke2-0-2-beta-migration-test:/config
version: '3.8'
