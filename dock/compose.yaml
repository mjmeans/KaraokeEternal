services:
  karaoke:
    build:
      args:
        # Note you can use anything in TAG that would be appropriate for: git checkout <tag/brahcn/hash>
        TAG: v2.0.1
      context: https://github.com/mjmeans/KaraokeEternal.git#refs/heads/dock
      dockerfile: dock/Dockerfile
    environment:
      - NODE_ENV=production
      - KES_PATH_DATA=/config
      - KES_PORT=8080
      - KES_SCANNER_LOG_LEVEL=0
      - KES_SERVER_LOG_LEVEL=0
    ports:
      - '19201:8080'
    restart: unless-stopped
    volumes:
      - /mnt/Storage/media/karaoke:/mnt/karaoke:ro
      - /mnt/Storage/apps/ke2-0-2-beta-migration-test:/config
